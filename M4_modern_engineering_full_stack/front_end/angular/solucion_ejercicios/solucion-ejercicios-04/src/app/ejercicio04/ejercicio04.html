<h2>Ejercicio 4</h2>

@switch (rolUsuario) {
  @case ('admin') {
    Acceso total
  }
  @case ('editor') {
    Puedes editar contenido
  }
  @case ('viewer') {
    Solo puedes ver contenido
  }
  @default {
    No tienes acceso
  }
}
<button (click)="cambiarRol()">
  Cambiar Rol (Actual: {{ rolUsuario }})
</button>
