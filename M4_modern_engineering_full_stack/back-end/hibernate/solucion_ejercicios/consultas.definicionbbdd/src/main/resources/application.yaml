spring:
  application:
    name: consultas.definicionbbdd

  datasource:
    primary:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://localhost:5433/definicion_bbdd
      username: postgres
      password: postgres
    secondary:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://localhost:5433/Northwind
      username: postgres
      password: postgres

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect






